  zhipu-glm-5.4-anthropic:
    pool: zhipu_v2_max
    protocol: anthropic
    auth: bearer
    upstream_base_url_env: ZHIPU_ANTHROPIC_BASE_URL
    default_base_url: https://open.bigmodel.cn/api/anthropic
    api_key_env: ZHIPU_API_KEY
    upstream_model: glm-5.4
    context_window: 512000
    cost_per_1m:
      input: 4.6
      cached_input: 1.1
      output: 16.0
  zhipu-glm-5.3-flash-anthropic:
    pool: zhipu_v2_max
    protocol: anthropic
    auth: bearer
    upstream_base_url_env: ZHIPU_ANTHROPIC_BASE_URL
