version: '2.0'
description: 共享套餐池（Shared Pools）5h / 周 / 月三窗口配额 + 2026-11 官方计费系数与最优旗舰兜底
default_cooldown_seconds: 300
soft_limit_ratio: 0.995
active_peak_avoidance: true
pools:
  zhipu_v2_max:
    # Limits are PERCENT of each window's allowance, taken from the provider
    # (/api/monitor/usage/quota/limit). Local rows are estimated credits in another unit and are
    # kept for spend visibility only; without a fresh provider reading the pool fails open.
    unit: percent
    last_option: false
    rolling_5h_limit: 100.0
    rolling_week_limit: 100.0
    rolling_month_limit: 100.0
    usage_endpoint: https://open.bigmodel.cn/api/monitor/usage/quota/limit
    usage_api_key_env: ZHIPU_API_KEY
    usage_auth: bearer
    usage_format: zhipu
    # A reading never refuses a pool on its own (booster top-ups raise the plan); only a real 429 does.
    remote_exhaustion_mode: informational
    peak_cost_multiplier: 1.0
    peak_windows_utc:
    - start: 01:30
      end: '10:30'
  kimi_allegretto:
    # Same rules as zhipu: percent from /coding/v1/usages (weekly usage + the 300-minute window).
    unit: percent
    last_option: false
    rolling_5h_limit: 100.0
    rolling_week_limit: 100.0
    rolling_month_limit: 100.0
    usage_endpoint: https://api.kimi.com/coding/v1/usages
    usage_api_key_env: KIMI_API_KEY
    usage_auth: bearer
    usage_format: kimi
    remote_exhaustion_mode: informational
    peak_cost_multiplier: 1.0
    peak_windows_utc:
    - start: 01:30
      end: '10:30'
  opencode_go_basic:
    # The limits below are PERCENT of the plan allowance (5h <= 20%, week <= 50%, month <= 100%),
    # matching what the provider reports. Local ledger rows for this pool are estimated dollars
    # in another unit, so they only decide exhaustion when the provider reading is unavailable.
    unit: percent
    last_option: false
    weekly_reset: monday_00_utc
    rolling_5h_limit: 20.0
    rolling_week_limit: 50.0
    rolling_month_limit: 100.0
    usage_endpoint: https://opencode.ai/inference/go/v1/usage
    usage_api_key_env: OPENCODE_GO_API_KEY
    usage_auth: bearer
    usage_format: opencode
    remote_exhaustion_mode: informational
    usage_headers:
      x-opencode-session: hs-harness-usage
    peak_cost_multiplier: 2.0
    peak_windows_utc:
    - start: '13:00'
      end: '21:00'
  workbuddy:
    # Tencent CodeBuddy/WorkBuddy via the workbuddy2api adapter (container harness-workbuddy). Points-based,
    # no usage API: limits are set high on purpose so a local estimate never pre-empts a request; the
    # provider's own 429 is the signal. Chain position: after Zhipu and Kimi, before OpenCode.
    unit: points
    last_option: false
    rolling_5h_limit: 1000000000.0
    rolling_week_limit: 1000000000.0
    rolling_month_limit: 1000000000.0
  github_copilot_pro_plus:
    unit: credits
    last_option: true
    rolling_5h_limit: 500.0
    rolling_week_limit: 2000.0
    rolling_month_limit: 7000.0
    peak_cost_multiplier: 1.0
    peak_windows_utc:
    - start: '13:00'
      end: '21:00'
  google_ai_pro:
    unit: usd_equiv
    last_option: true
    rolling_5h_limit: 5.0
    rolling_week_limit: 20.0
    rolling_month_limit: 60.0
    peak_cost_multiplier: 1.0
    peak_windows_utc: []
models:
  zhipu-glm-5.4:
    pool: zhipu_v2_max
    protocol: openai
    upstream_base_url_env: ZHIPU_BASE_URL
    default_base_url: https://open.bigmodel.cn/api/coding/paas/v4
    api_key_env: ZHIPU_API_KEY
    upstream_model: glm-5.4
    # Verified 2026-11-26 from the live gateway: a 2x2 red PNG answered "Red". Set only where checked —
    # a vision flag nobody tested is the same defect as a silent substitution (issues #22, #26).
    vision: true
    context_window: 512000
    cost_per_1m:
      input: 4.6
      cached_input: 1.1
      output: 16.0
    avoid_in_peak_for_tiers:
    - system_0
    - system_1
  zhipu-glm-5.3-flash:
    pool: zhipu_v2_max
    protocol: openai
    upstream_base_url_env: ZHIPU_BASE_URL
    default_base_url: https://open.bigmodel.cn/api/coding/paas/v4
    api_key_env: ZHIPU_API_KEY
    upstream_model: glm-5.3-flash
    context_window: 1000000
    cost_per_1m:
      input: 2.3
      cached_input: 0.56
      output: 8.0
    avoid_in_peak_for_tiers: []
  kimi-k3.1-pro:
    pool: kimi_allegretto
    protocol: openai
    upstream_base_url_env: KIMI_BASE_URL
    default_base_url: https://api.kimi.com/coding/v1
    api_key_env: KIMI_API_KEY
    upstream_model: k3.1-pro
    cost_per_1m:
      input: 4.0
      cached_input: 1.0
      output: 16.0
    avoid_in_peak_for_tiers:
    - system_0
    - system_1
  kimi-for-coding:
    pool: kimi_allegretto
    protocol: openai
    upstream_base_url_env: KIMI_CODING_BASE_URL
    default_base_url: https://api.kimi.com/coding/v1
    api_key_env: KIMI_API_KEY
    upstream_model: kimi-for-coding
    cost_per_1m:
      input: 2.5
      cached_input: 0.6
      output: 10.0
    avoid_in_peak_for_tiers:
    - system_0
  kimi-for-coding-anthropic:
    pool: kimi_allegretto
    protocol: anthropic
    auth: bearer
    upstream_base_url_env: KIMI_ANTHROPIC_BASE_URL
    default_base_url: https://api.kimi.com/coding
    api_key_env: KIMI_API_KEY
    upstream_model: kimi-for-coding
    cost_per_1m:
      input: 2.5
      cached_input: 0.6
      output: 10.0
    avoid_in_peak_for_tiers:
    - system_0
    - system_1
  kimi-k3.1-pro-anthropic:
    pool: kimi_allegretto
    protocol: anthropic
    auth: bearer
    upstream_base_url_env: KIMI_ANTHROPIC_BASE_URL
    default_base_url: https://api.kimi.com/coding
    api_key_env: KIMI_API_KEY
    upstream_model: k3.1-pro
    cost_per_1m:
      input: 4.0
      cached_input: 1.0
      output: 16.0
    avoid_in_peak_for_tiers:
    - system_0
    - system_1
  opencode-deepseek-v4.1-flash:
    pool: opencode_go_basic
    protocol: openai
    upstream_base_url_env: OPENCODE_GO_BASE_URL
    default_base_url: https://opencode.ai/inference/go/v1
    api_key_env: OPENCODE_GO_API_KEY
    upstream_model: deepseek-v4.1-flash
    max_effort: low
    upstream_headers:
      x-opencode-session: '{session}'
    cost_per_1m:
      input: 0.25
      cached_input: 0.05
      output: 1.0
    avoid_in_peak_for_tiers:
    - system_0
  opencode-deepseek-v4.1-flash-anthropic:
    pool: opencode_go_basic
    protocol: anthropic
    auth: bearer
    upstream_base_url_env: OPENCODE_ANTHROPIC_BASE_URL
    default_base_url: https://opencode.ai/inference/go
    api_key_env: OPENCODE_GO_API_KEY
    upstream_model: deepseek-v4.1-flash
    max_effort: low
    upstream_headers:
      x-opencode-session: '{session}'
    cost_per_1m:
      input: 0.25
      cached_input: 0.05
      output: 1.0
    avoid_in_peak_for_tiers:
    - system_0
  workbuddy-hy4:
    pool: workbuddy
    protocol: openai
    # Container-to-container on the compose network; the host port 8790 is for manual checks only.
    default_base_url: http://harness-workbuddy:8790/v1
    upstream_model: hy4
    cost_per_1m:
      input: 3.0
      cached_input: 0.3
      output: 12.0
  workbuddy-glm-5.4:
    pool: workbuddy
    protocol: openai
    default_base_url: http://harness-workbuddy:8790/v1
    upstream_model: glm-5.4
    cost_per_1m:
      input: 3.0
      cached_input: 0.3
      output: 12.0
  copilot-claude-fable-5.2:
    pool: github_copilot_pro_plus
    protocol: openai
    auth: copilot
    upstream_base_url_env: GITHUB_COPILOT_BASE_URL
    default_base_url: https://api.githubcopilot.com
    upstream_model: claude-fable-5.2
    cost_per_1m:
      input: 15.0
      cached_input: 3.0
      output: 75.0
    avoid_in_peak_for_tiers:
    - system_0
    - system_1
    - system_1_5
  copilot-claude-sonnet-5.5:
    pool: github_copilot_pro_plus
    protocol: openai
    auth: copilot
    upstream_base_url_env: GITHUB_COPILOT_BASE_URL
    default_base_url: https://api.githubcopilot.com
    upstream_model: claude-sonnet-5.5
    cost_per_1m:
      input: 3.0
      cached_input: 0.3
      output: 15.0
    avoid_in_peak_for_tiers:
    - system_0
    - system_1
  google-ai-gemini-4-neon:
    pool: google_ai_pro
    protocol: openai
    auth: google
    upstream_base_url_env: GOOGLE_AI_BASE_URL
    default_base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    upstream_model: gemini-flash-lite-latest
    cost_per_1m:
      input: 3.0
      cached_input: 0.15
      output: 15.0
    avoid_in_peak_for_tiers:
    - system_0
    - system_1
  google-ai-gemini-4-hydrogen:
    pool: google_ai_pro
    protocol: openai
    auth: google
    upstream_base_url_env: GOOGLE_AI_BASE_URL
    default_base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    upstream_model: gemini-4-hydrogen
