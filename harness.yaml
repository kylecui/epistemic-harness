# 单一规范源 — Epistemic & Dual-Process Governance Harness
version: 0.3.0
name: epistemic-dual-process-harness
description: Canonical Single Source of Truth for the Epistemic & Dual-Process Governance
  Harness (Phase 1+2).
epistemic_tiers:
  L1:
    label: Axioms & Hard Invariants
    read_only: true
    allow_model_invention: false
    priority: 1
    admission_rule: Strictly mathematical/physical theorems, formal definitions, statutes,
      or explicit immutable invariants. Engineering folklore (e.g., UNIX philosophy,
      keep it simple) and team/budget limits are NOT L1; classify them as L3 heuristics
      or L4 constraints.
  L2:
    label: Verifiable Facts & Primary Evidence
    require_provenance: true
    max_age_days: 180
    priority: 2
    admission_rule: Primary documentation, telemetry, logs, code, or sourced external
      records. Proves observed facts only; never extrapolates automatically into universal
      causal laws.
  L3:
    label: Heuristics & Empiricism
    falsifiable: true
    require_scope_and_counter_examples: true
    priority: 3
    admission_rule: Industry best practices, rules of thumb, personal notes, and intuition.
      Always treat as falsifiable candidate hypotheses; every L3 citation MUST state
      its applicable scope conditions and failure counter-examples.
  L4:
    label: User Intent & Resource Constraints
    cannot_override:
    - L1
    priority: 4
    admission_rule: User goals, team size, budget, latency targets, and subjective
      trade-offs. Overrides L3 heuristics when they conflict, but can NEVER override
      L1 objective invariants.
  L5:
    label: Interim Derivations & Conclusions
    default_status: provisional
    weakest_link_inheritance: true
    priority: 5
    admission_rule: Confidence ceiling is deterministically computed in code as min(all
      upstream dependencies). Any derivation depending on an L3 heuristic is hard-capped
      at L3 and cannot be silently promoted.
cognitive_spectrum:
  system_0:
    label: Reflexive Execution (Tier 0)
    reasoning_effort: none
    use_for: Unambiguous formatting, direct command translation, or mechanical edits.
      Return concise output immediately.
  system_1:
    label: Fast Intuition (Tier 1)
    reasoning_effort: low
    use_for: Rapid exploration, initial screening, and lightweight sub-agent retrieval.
      Mark L3 candidates as provisional.
  system_1_5:
    label: Structured Analysis (Tier 1.5)
    reasoning_effort: medium
    default_analysis_tier: true
    use_for: Default tier for routine debugging, multi-option trade-offs, and single-turn
      analysis.
  system_2:
    label: Deliberative Derivation (Tier 2)
    reasoning_effort: high
    use_for: 'High-bar only: cross-source L1 conflicts, irreversible high-stakes decisions,
      or formal first-principles proofs.'
  system_2_plus:
    label: Metacognitive Critic (Tier 2+)
    reasoning_effort: high
    use_for: Independent audit/convergence pass (routed cross-family when available)
      to catch L3-disguised-as-L1 and logic leaps.
anti_thrashing:
  stop_loss_on_missing_l2: true
  max_l3_directions_on_stoploss: 2
  min_l2_actions_on_stoploss: 1
  max_l2_actions_on_stoploss: 3
  directive: 'When blocked by an L1/L4 conflict or missing primary L2 evidence, stop
    immediately instead of spinning in self-doubt loops (''Wait, but wait...''). Output
    only: (1) confirmed L1/L2 facts, (2) the minimal branching unknown (at most 2
    top candidate directions in 1-2 sentences), and (3) 1-3 concrete verification
    or user-decision actions.'
thinking_language:
  mode: en_with_native_terms
  response_language: match_user
  directive: Conduct internal reasoning and thinking in concise English for higher
    logical density (preserving domain-specific non-English legal/business terms verbatim
    to avoid translation loss). Always write the final user-facing answer strictly
    in the user's prompt language.
  reasoning_style:
    title: Reasoning Style (English)
    directive: Conduct all internal reasoning in concise English using concrete engineering
      verbs and falsifiable claims; avoid vague corporate filler (leverage, holistic,
      seamless, paradigm, robust, synergy, streamline, delve into).
  output_style:
    title: Output Style (User Language)
    directive: 'Do not translate literally from English reasoning. Rewrite naturally
      in idiomatic Chinese (or the user prompt language): short sentences, active
      verbs, no internet/corporate buzzwords (赋能, 抓手, 闭环, 底层逻辑, 组合拳, 颗粒度, 心智, 降本增效,
      拉通, 对齐, 打通, 沉淀, 链路), and no stiff translationese (avoid passive 被...所... and
      stacked 的...的... modifiers).'
orchestration:
  controller_contract: 'The main agent is a pure controller: understand the task,
    decompose it, classify each subtask (classify_task), dispatch to a sub-agent (dispatch_subagent),
    collect results, and converge (submit_l5_claim + audit_dag). The main agent NEVER
    writes concrete implementation content itself.'
  agent_profiles:
    explorer: system_1
    coder: system_1_5
    deep: system_2
    critic: system_2_plus
  auto_skill_attach: true
  enforcement_layers:
  - prompt: AGENTS.md auto-loaded by the client at project level; no manual skill
      invocation required
  - transport: proxy gateway injects thinking-language policy, clamps reasoning effort,
      enforces tier tags, and trips anti-thrashing auto-recovery on every request
  - tool: epistemic-mcp and epistemic-orchestrator MCP servers are always connected;
      L5 claims and converge gates are enforced in code
