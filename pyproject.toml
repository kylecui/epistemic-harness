[project]
name = "epistemic-harness"
version = "0.5.4"
description = "Epistemic and Dual-Process Governance Harness (runtime and tooling)"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.uv]
# Not a distributable package: this project exists to pin the runtime deps.
package = false
