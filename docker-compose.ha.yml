# Blue/green router overlay — the fix for "an upgrade took the only exit down".
#
# Why an overlay: the base docker-compose.yml publishes harness-backend on 8787, and the gate needs
# that same port. In HA mode the gate owns 8787 and the base service is NOT started.
#
# Switch over (one short window, once):
#   docker compose -f docker-compose.yml -f docker-compose.ha.yml up -d backend-blue router-gate
#   python scripts/router_switch.py status            # expect active=blue
#   docker compose stop harness-backend               # frees 8787 for the gate
#   python scripts/router_switch.py status
#
# Upgrade from then on (no client-visible interruption):
#   python scripts/router_build.py                    # builds :staging, imports it, promotes :local
#   docker compose -f docker-compose.yml -f docker-compose.ha.yml up -d backend-green
#   python scripts/router_switch.py switch green
#   docker compose -f docker-compose.yml -f docker-compose.ha.yml up -d backend-blue   # rebuild idle side
#
# Rollback is one command: python scripts/router_switch.py switch blue
services:
  backend-blue:
    extends:
      file: docker-compose.yml
      service: harness-backend
    container_name: harness-backend-blue
    # !reset: `extends` also inherits the base service's `solo` profile, which would hide this service
    # by default and make router-gate's depends_on reference an undefined service (hit 2026-11-26).
    profiles: !reset []
    environment:
      # Each side writes its own trace shard: two containers appending to one jsonl interleave lines.
      HARNESS_TRACES_DIR: /app/traces/blue
    # !override, not a plain list: `extends` merges the base's 8787 publication, which is the gate's
    ports: !override
      - "127.0.0.1:8789:8787"

  backend-green:
    extends:
      file: docker-compose.yml
      service: harness-backend
    container_name: harness-backend-green
    profiles: !reset []
    environment:
      HARNESS_TRACES_DIR: /app/traces/green
    ports: !override
      - "127.0.0.1:8790:8787"

  router-gate:
    image: python:3.12-slim
    container_name: router-gate
    command: ["python", "/gate/router_gate.py"]
    volumes:
      - ./scripts/router_gate.py:/gate/router_gate.py:ro
    environment:
      HARNESS_GATE_BACKENDS: "blue=http://backend-blue:8787,green=http://backend-green:8787"
      HARNESS_GATE_ACTIVE: "blue"
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      # The gate is the only exit: Docker must be able to tell a half-open listener from a working one.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8787/__gate/status', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - backend-blue
    restart: unless-stopped
